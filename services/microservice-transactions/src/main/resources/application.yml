server:
  port: 8081

spring:
  application:
    name: microservice-transactions

  # ── MariaDB ────────────────────────────────────────────
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:transactions_db}
    username: ${DB_USERNAME:koins_txn_user}
    password: ${DB_PASSWORD:Txn_S3cure#Pass!}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  # ── Kafka Producer ────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

# ── Gateway JWKS Configuration ─────────────────────────
app:
  gateway:
    jwks-url: ${GATEWAY_JWKS_URL:http://localhost:8080/api/v1/.well-known/jwks.json}
  kafka:
    topic:
      transactions: transaction-events
  outbox:
    poll-interval-ms: 500
    batch-size: 50

# ── Actuator / Prometheus ──────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
