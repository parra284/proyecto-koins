server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Redis (Rate Limiting) ────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

# ── Gateway Configuration ─────────────────────────────────
gateway:
  # ── JWKS Dynamic Key Rotation ───────────────────────────
  security:
    auth-jwks-url: ${AUTH_JWKS_URL:http://localhost:8083/.well-known/jwks.json}
    jwks-refresh-interval-minutes: ${JWKS_REFRESH_INTERVAL:5}

  # ── Rate Limiting (Token Bucket) ────────────────────────
  rate-limit:
    bucket-capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-rate-per-second: ${RATE_LIMIT_REFILL:10}

  # ── Route Catalogue ─────────────────────────────────────
  routes:
    - public-path-pattern: /api/transactions/**
      target-service-url: http://microservice-transactions:8081
      requires-authentication: true
      strip-prefix: /api/transactions
      header-transformations:
        X-Origin-Service: api-gateway
    - public-path-pattern: /api/analysis/**
      target-service-url: http://microservice-analysis:8082
      requires-authentication: true
      strip-prefix: /api/analysis
      header-transformations:
        X-Origin-Service: api-gateway
    # ── Auth Service (public endpoints: login, register) ───
    - public-path-pattern: /api/auth/**
      target-service-url: http://localhost:8083/api/v1/auth
      requires-authentication: false
      strip-prefix: /api/auth
      header-transformations:
        X-Origin-Service: api-gateway
    - public-path-pattern: /health
      target-service-url: http://localhost:8080
      requires-authentication: false

# ── Actuator / Prometheus ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
