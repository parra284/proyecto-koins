server:
  port: 8083

spring:
  application:
    name: microservice-auth

  # ── MariaDB (Isolated Auth Database) ────────────────────
  datasource:
    url: jdbc:mariadb://localhost:3307/koins_auth_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  # ── Redis (Denylist + Rate Limiting Cache) ──────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# ── Auth Service Configuration ────────────────────────────
auth:
  security:
    # BCrypt strength factor (log2 rounds)
    bcrypt-strength: 12
    # Account lockout configuration
    max-failed-attempts: 3
    lockout-duration-minutes: 15
    # Session token validity
    session-token-validity-minutes: 30
    # Rate limiting (DoS mitigation)
    rate-limit-window-seconds: 300
    rate-limit-max-attempts: 10

# ── Actuator / Prometheus ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
