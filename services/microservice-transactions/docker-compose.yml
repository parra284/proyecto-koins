
# ═══════════════════════════════════════════════════════════════
#  Microservice Transactions — Docker Compose
#  Infraestructura local: MariaDB + Apache Kafka + Kafka UI
# ═══════════════════════════════════════════════════════════════
#  Uso:
#    docker-compose up -d          → Levantar todos los servicios
#    docker-compose logs -f        → Ver logs en tiempo real
#    docker-compose down -v        → Apagar y eliminar volúmenes
# ═══════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────
  # 1. Motor de Base de Datos — MariaDB
  # ────────────────────────────────────────────────────────────
  # Almacena las tablas: transactions, outbox_events
  # El script schema.sql se ejecuta automáticamente en el
  # primer arranque gracias al volumen de inicialización.
  # ────────────────────────────────────────────────────────────
  mariadb-transactions:
    image: mariadb:11.4
    container_name: koins-transactions-mariadb
    restart: always
    ports:
      - "${DB_PORT:-3308}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-R00t_K0ins!2026}
      MARIADB_DATABASE: ${DB_NAME:-transactions_db}
      MARIADB_USER: ${DB_USERNAME:-koins_txn_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-Txn_S3cure#Pass!}
    volumes:
      - koins_transactions_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - koins-transactions-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # 2. Bróker de Eventos — Apache Kafka (KRaft mode, sin ZooKeeper)
  # ────────────────────────────────────────────────────────────
  # Kafka en modo KRaft elimina la dependencia de ZooKeeper,
  # simplificando la infraestructura local.
  # El tópico 'transaction-events' se crea automáticamente
  # por KafkaConfig.java al arrancar el microservicio.
  # ────────────────────────────────────────────────────────────
  kafka-transactions:
    image: apache/kafka:3.8.1
    container_name: koins-transactions-kafka
    restart: always
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # ── KRaft Configuration (sin ZooKeeper) ──
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-transactions:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ── Listeners ──
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-transactions:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── Topic Defaults ──
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6

      # ── Cluster ID ──
      CLUSTER_ID: "TxnKoins2026ClusterId01"
    volumes:
      - koins_kafka_data:/var/lib/kafka/data
    networks:
      - koins-transactions-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # 3. Kafka UI — Panel de Administración Web
  # ────────────────────────────────────────────────────────────
  # Interfaz visual para inspeccionar tópicos, particiones,
  # mensajes y consumidores. Accesible en:
  #   http://localhost:9080
  # ────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: koins-transactions-kafka-ui
    restart: always
    ports:
      - "${KAFKA_UI_PORT:-9080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: koins-transactions
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-transactions:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - koins-transactions-network
    depends_on:
      kafka-transactions:
        condition: service_healthy

# ══════════════════════════════════════════════════════════════
# Volúmenes Persistentes
# ══════════════════════════════════════════════════════════════
volumes:
  koins_transactions_data:
    driver: local
  koins_kafka_data:
    driver: local

# ══════════════════════════════════════════════════════════════
# Red Interna
# ══════════════════════════════════════════════════════════════
networks:
  koins-transactions-network:
    driver: bridge
